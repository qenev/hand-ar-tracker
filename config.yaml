# Configuration for Hand AR Tracker system

camera:
  # Camera index (typically 0 for default built-in webcam, 1+ for external usb webcams)
  index: 0
  # Requested video width in pixels
  width: 1280
  # Requested video height in pixels
  height: 720
  # Requested frame rate (FPS)
  fps: 30

tracking:
  # Maximum number of hands to detect and track simultaneously (1 or 2)
  max_hands: 2
  # Minimum confidence value ([0.0, 1.0]) for hand detection to be considered successful
  min_detection_confidence: 0.7
  # Minimum confidence value ([0.0, 1.0]) for hand landmarks to be tracked successfully
  min_tracking_confidence: 0.6

renderer:
